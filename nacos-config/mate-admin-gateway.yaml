# ==========================================
# Nacos 配置 — mate-admin-gateway.yaml
# Gateway 专属：端口、路由规则、白名单、日志
# ==========================================

server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: mate-admin-uaa
          uri: lb://mate-admin-uaa
          predicates:
            - Path=/auth/**
        - id: mate-admin-system
          uri: lb://mate-admin-system
          predicates:
            - Path=/system/**

gateway:
  white-list: /auth/login,/auth/captcha

sentinel:
  qps:
    login: 40
    user-page: 500
    role-assign: 50

logging:
  level:
    com.mate: debug
