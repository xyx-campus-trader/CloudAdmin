# ==========================================
# Nacos 配置 — mate-admin-gateway.yaml
# Gateway 专属：端口、路由规则、白名单、日志
# ==========================================

server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: mate-admin-uaa
          uri: lb://mate-admin-uaa
          predicates:
            - Path=/auth/**
        - id: mate-admin-system
          uri: lb://mate-admin-system
          predicates:
            - Path=/system/**

gateway:
  white-list:
    - /auth/login
    - /auth/captcha

logging:
  level:
    com.mate: debug
