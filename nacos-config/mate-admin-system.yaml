# ==========================================
# Nacos 配置 — mate-admin-system.yaml
# System 专属：端口、MyBatis-Plus、Redisson、日志
# ==========================================

server:
  port: 8082

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

redisson:
  address: redis://${REDIS_HOST:127.0.0.1}:6379
  database: 1
  connection-minimum-idle-size: 2
  connection-pool-size: 8

lock:
  assign:
    wait-timeout: 3
    lease-time: 15

logging:
  file:
    name: logs/mate-admin-system.log
  level:
    com.mate: debug
    com.mate.admin.system.aspect: warn
