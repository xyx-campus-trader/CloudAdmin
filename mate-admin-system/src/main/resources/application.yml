server:
  port: 8082

spring:
  application:
    name: mate-admin-system
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/cloud_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
  cache:
    type: redis

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

redisson:
  address: redis://127.0.0.1:6379
  database: 1

# 钉钉群机器人 webhook（本地部署时替换为真实 token，不提交到 Git）
alert:
  webhook:
    url: https://oapi.dingtalk.com/robot/send?access_token=your_token_here

logging:
  level:
    com.mate: debug