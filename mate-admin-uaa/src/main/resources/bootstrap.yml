spring:
  config:
    import: optional:nacos:
  application:
    name: mate-admin-uaa
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
        file-extension: yaml
        shared-configs:
          - data-id: mate-admin-common.yaml
            group: DEFAULT_GROUP
            refresh: true
