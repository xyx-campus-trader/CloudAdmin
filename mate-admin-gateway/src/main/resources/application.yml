server:
  port: 8080

spring:
  application:
    name: mate-admin-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: mate-admin-uaa
          uri: lb://mate-admin-uaa
          predicates:
            - Path=/auth/**
        - id: mate-admin-system
          uri: lb://mate-admin-system
          predicates:
            - Path=/system/**
    sentinel:
      transport:
        dashboard: 127.0.0.1:8080
        port: 8719
  redis:
    host: 127.0.0.1
    port: 6379

# JWT
jwt:
  secret: ${JWT_SECRET:c2VjcmV0X2tleV9mb3JfY2xvdWRhZG1pbl9hdXRoX3BsYXRmb3JtX3dpdGhfc3VmZmljaWVudF9sZW5ndGhfZm9yX2hzNTEy}
  expiration: 604800

# Gateway white list
gateway:
  white-list: /auth/login,/auth/captcha

# Sentinel 限流阈值
sentinel:
  qps:
    login: 40

logging:
  level:
    com.mate: debug